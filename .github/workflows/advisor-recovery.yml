name: V2 yedek ve geri donus
on:
  schedule:
    - cron: '25 20 * * 1-5'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements-runtime.txt
      - run: python -m advisor backup --output /tmp/advisor-backup.zip
      - run: python -m advisor recovery-check --input /tmp/advisor-backup.zip
      - uses: actions/upload-artifact@v4
        with:
          name: advisor-backup-${{ github.run_id }}
          path: /tmp/advisor-backup.zip
          retention-days: 90
