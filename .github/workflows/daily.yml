name: Gunluk otonom rapor

# Her gun 15:35 UTC (18:35 TR; cron gecikmesi payi ile 18:45 hedefi).
# import_actions -> EVDS -> (pazartesi mutabakat) -> rapor (pazar: haftalik) -> Telegram -> commit.

on:
  schedule:
    - cron: "35 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# AYRI GRUP (2026-08-11). Eskiden arsivleyiciyle ayni "repo-commit" grubundaydi.
# GitHub bir concurrency grubunda YALNIZ BIR bekleyen kosu tutar: gunluk rapor
# siraya girdikten sonra 15 dk'lik arsiv kosusu gelince bekleyeni DUSURUYOR.
# 2026-08-06'da tam bu oldu -> daily "cancelled", rapor_2026-08-06.md yok,
# asof=2026-08-05 tahmini hic yazilmadi. Push cakismasi zaten asagidaki
# "git pull --rebase + 3 deneme" dongusuyle cozuluyor; grubu paylasmaya gerek yok.
concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bagimliliklar
        run: pip install --quiet -r requirements.txt

      - name: DB'yi dump'tan restore et (binary git'te yok)
        run: python -m src.restore_db

      - name: Gunluk is (import + evds + rapor + Telegram)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python -m src.daily_job

      - name: DB'yi dump'a yaz (commit icin diff'lenebilir)
        run: python -m src.dbdump

      - name: Commit + push (rebase korumali)
        run: |
          git config user.name "altin-daily"
          git config user.email "actions@github.com"
          # data/altin.sqlite gitignore'da; data/altin.sql, telegram_outbox.jsonl,
          # zskor_prova.jsonl izlenir
          git add data/ reports/
          if ! git diff --cached --quiet; then
            git commit -m "daily: rapor $(date -u +%Y-%m-%d)"
            # 5 deneme + artan bekleme: gunluk rapor arsivleyiciyle AYRI concurrency
            # grubunda oldugu icin (iptal edilmesin diye) push yarisi mumkun.
            # Yaris ucuz ve nadirdir; iptal edilen kosu ise gunun TAMAMINI kaybettirir.
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "push retry $i"; sleep $((i * 5))
            done
          else
            echo "degisiklik yok"
          fi
