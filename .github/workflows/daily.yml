name: Gunluk otonom rapor

# Her gun 15:35 UTC (18:35 TR; cron gecikmesi payi ile 18:45 hedefi).
# import_actions -> EVDS -> (pazartesi mutabakat) -> rapor (pazar: haftalik) -> Telegram -> commit.

on:
  schedule:
    - cron: "35 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# SQL'in iki yazarı yarışmaz. queue:max eski tek-bekleyen iptalini önler.
# 2026-09-30: GitHub Cloud concurrency belgeleriyle doğrulandı; sözleşme testi var.
concurrency:
  group: repo-commit
  cancel-in-progress: false
  queue: max

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bagimliliklar
        run: pip install --quiet -r requirements-runtime.txt

      - name: DB'yi dump'tan restore et (binary git'te yok)
        run: python -m src.restore_db

      - name: Gunluk is (import + evds + rapor + Telegram)
        env:
          ADVISOR_V2: '1'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python -m src.daily_job

      - name: DB'yi dump'a yaz (commit icin diff'lenebilir)
        run: python -m src.dbdump

      - name: Commit + push (rebase korumali)
        run: |
          git config user.name "altin-daily"
          git config user.email "actions@github.com"
          # data/altin.sqlite gitignore'da; data/altin.sql, telegram_outbox.jsonl,
          # zskor_prova.jsonl izlenir
          git add data/ reports/
          if ! git diff --cached --quiet; then
            git commit -m "daily: rapor $(date -u +%Y-%m-%d)"
            # 5 deneme + artan bekleme: gunluk rapor arsivleyiciyle AYRI concurrency
            # grubunda oldugu icin (iptal edilmesin diye) push yarisi mumkun.
            # Yaris ucuz ve nadirdir; iptal edilen kosu ise gunun TAMAMINI kaybettirir.
            bash ops/push_retry.sh
          else
            echo "degisiklik yok"
          fi
