# ================= Altın Takip MVP — Yapılandırma =================
# Tüm eşik / URL / oran bu dosyada. Kod içine sabit gömülmez.

timezone_offset_hours: 3          # Türkiye UTC+3 (sabit, DST yok)

# Çalışma modu — sağlık metrikleri (kapsama / arşiv) buna göre kalibre edilir.
#   actions   : GitHub Actions cron'u. Zamanlanmış iş akışları kısıtlanır (bkz. alerts).
#   collector : 7/24 canlı toplayıcı. truncgil poll_seconds geçerli olur.
runtime_mode: "actions"

paths:
  db: "data/altin.sqlite"
  db_dump: "data/altin.sql"             # diff'lenebilir dump (binary DB yerine commit'lenir)
  reports_dir: "reports"
  evds_series_file: "evds_series.json"
  holidays_file: "holidays_tr.yaml"

# ----------------- Veri kaynakları -----------------
sources:
  # Arşiv çekiminde bir kaynak boş/başarısız dönerse kısa aralıkla tekrar dener.
  # GitHub cron sıklığını (throttling) DEĞİŞTİRMEZ; çalışan turlarda veri
  # kalitesini artırır — truncgil transient hataları ~%7 geçersiz kayıt yaratıyordu.
  fetch_retries: 3
  fetch_retry_backoff_s: 4
  truncgil:
    url: "https://finans.truncgil.com/v3/today.json"
    poll_seconds: 60
    timeout: 20
    # Truncgil JSON anahtar eşlemesi (şema değişirse buradan güncelle)
    keys:
      usd: "USD"
      gram_altin: "gram-altin"          # perakende gram (saflık düzeltmesi GEREKTİRİR)
      gram_has_altin: "gram-has-altin"  # has (saf) referans — prim bunun üzerinden
      ceyrek: "ceyrek-altin"
      yarim: "yarim-altin"
      tam: "tam-altin"
      cumhuriyet: "cumhuriyet-altini"
    update_date_key: "Update_Date"

  yfinance:
    poll_seconds: 300                   # gecikmeli + rate-limit; 5 dk yeterli
    ons_ticker: "GC=F"                  # ons XAU/USD (futures proxy — canlı)
    ons_fallback_ticker: "XAUUSD=X"
    ons_hist_primary: "GC=F"            # tarihsel için GC=F (XAUUSD=X artık 404 veriyor)
    usdtry_ticker: "TRY=X"

  evds:
    # 2024 sonrası yeni servis yolu (evds2/service/evds artık SPA'ya yönleniyor).
    base: "https://evds3.tcmb.gov.tr/igmevdsms-dis"
    # API key .env içinde EVDS_API_KEY. Key header'da gönderilir (Nisan 2024 kuralı).
    start_date: "01-01-2015"
    # CANLI KEYLE TEYİT EDİLDİ (2026-07-07). Frekans yorumda.
    series:
      usdtry_buy: "TP.DK.USD.A.YTL"          # günlük
      usdtry_sell: "TP.DK.USD.S.YTL"         # günlük
      eurtry_buy: "TP.DK.EUR.A.YTL"          # günlük
      tufe: "TP.FE.OKTG01"                    # aylık (TÜFE endeksi 2003=100)
      kulce_altin_sell: "TP.MK.KUL.YTL"       # aylık — Kapalıçarşı tarihsel proxy
      cumhuriyet_sell: "TP.MK.CUM.YTL"        # aylık
      aofm_politika: "TP.APIFON4"             # günlük — AOFM (politika faizi proxy)
      mevduat_1ay: "TP.TRY.MT02"              # haftalık
      mevduat_3ay: "TP.TRY.MT03"              # haftalık
      mevduat_6ay: "TP.TRY.MT04"              # haftalık
      mevduat_1yil: "TP.TRY.MT06"             # haftalık
      enf_bek_12ay: "TP.ENFBEK.PKA12ENF"      # aylık — piyasa kat. 12 ay TÜFE beklentisi
    # 5 yıl backfill'e girecek seriler (tek seferlik, backtest hazırlığı)
    backfill:
      - usdtry_sell
      - tufe
      - kulce_altin_sell
      - cumhuriyet_sell
      - aofm_politika
      - mevduat_3ay
      - mevduat_1yil
      - enf_bek_12ay
    # Rapor bağlam satırları için stopaj (net mevduat faizi hesabı)
    mevduat_stopaj_pct: 15.0

# ----------------- Piyasa takvimi / durum makinesi -----------------
market:
  # Bacak bazında bayatlama eşiği (saniye). Aşınca STALE.
  stale_seconds:
    truncgil_gunduz: 300
    truncgil_gece: 3600
    yfinance: 1200                      # 20 dk (gecikmeli veri toleransı)
    evds: 172800                        # 2 gün (günlük yayın)
  gece_baslangic_hour: 1                # TR saatiyle 01:00-08:00 "gece" (düşük likidite)
  gece_bitis_hour: 8
  # Forex (ons + kur) seansı UTC: Pazar 22:00 -> Cuma 21:00 açık
  forex_open_sunday_utc_hour: 22
  forex_close_friday_utc_hour: 21

# ----------------- Enstrüman metrikleri (has içerik) -----------------
instruments:
  troy_ounce_gram: 31.1034768
  coins:
    ceyrek:   { gross_g: 1.804, milyem: 0.916 }
    yarim:    { gross_g: 3.608, milyem: 0.916 }
    tam:      { gross_g: 7.216, milyem: 0.916 }
    cumhuriyet: { gross_g: 7.216, milyem: 0.916 }

# ----------------- Enstrüman maliyet/vergi modeli (Bölüm 4) -----------------
# Tüm oranlar buradan; 2026 ortası. Değişebilir — mali müşavirle doğrula.
instrument_costs:
  varsayilan_altin_getiri_yillik_pct: 30.0   # karşılaştırma senaryosu (nötr varsayım)
  banka_hesap:
    alis_makas_pct: 0.5
    satis_makas_pct: 0.5
    bsmv_pct: 0.2            # fiziki teslimatsız kaydi altında binde 2
  altin_fonu:
    yonetim_ucreti_yillik_pct: 1.0
    stopaj_pct: 15.0         # kâr üzerinden (26 Mart 2026'da %7.5'ten yükseldi)
  fiziki_gram:
    alis_satis_makas_pct: 3.0   # kuyumcu round-trip makas
  altins1:
    komisyon_pct: 0.2       # alış+satış her biri

# ----------------- Hesap / istatistik -----------------
stats:
  zscore_min_samples: 60                # arşiv < 60 gün ise "yetersiz veri"
  prim_sane_band_pct: 3.0               # |prim| bu bandın dışındaysa uyarı
  # Z-skor KURU PROVASI: kapı açılmadan (60 gün) "z ne olurdu" her gün kaydedilir.
  # Bildirim GÖNDERMEZ — amaç, kapı açıldığında eşiğin makul sıklıkta tetiklenip
  # tetiklenmediğini önceden bilmek (bkz. signals.zscore_dry_run).
  zskor_prova_aktif: true
  zskor_prova_dosyasi: "data/zskor_prova.jsonl"

# ----------------- Backtest (Bölüm 2) -----------------
backtest:
  start: "2016-01-01"
  oos_split: "2023-01-01"               # out-of-sample: öncesi fit, sonrası test
  horizons_days: { "1ay": 21, "3ay": 63, "6ay": 126 }
  weak_n_threshold: 15                  # N < bu ise "istatistiksel olarak zayıf"
  gma_window: 200                       # ons trend eşiği
  real_rate_trend_days: 63              # DFII10 trend penceresi (~3 ay)
  kur_vol_window: 60                    # gerçekleşen kur oynaklığı penceresi (gün)
  # 60g yıllıklaştırılmış kur oynaklığı eşiği: altı "baskılanıyor", üstü "serbest".
  # TL yönetilen dönemlerde <%15, serbest/şok dönemlerde >%25 tarihsel gözlem.
  kur_vol_annual_threshold_pct: 20.0
  dca_monthly_try: 1000                 # aylık DCA tutarı (nominal karşılaştırma)

# ----------------- Karar motoru (Bölüm 8) -----------------
# AMAÇ FONKSİYONU: terminal GRAM sayısı. TL getirisi DEĞİL.
#
# ÖLÇÜLEN ENGEL (2026-07-26, 2561 gün 2016-01-04→2026-07-24, örtüşmeyen pencere,
# TP.TRY.MT03 mevduat carry'si net dahil): "SAT → mevduat → geri al" işleminin
# gram kazancı ortalaması 1 haftada -0.46%, 1 ayda -1.98%, 3 ayda -6.20%,
# 6 ayda -12.71%. SAT'ın kazanma oranı sırasıyla %43/%36/%28/%10.
# Alt dönemlerde İŞARET DEĞİŞMİYOR (2016-19 -1.40, 2020-22 -2.67, 2023-26 -2.07)
# → dönem artefaktı değil, yapısal: TL mevduat faizi ≈ TL değer kaybı ≈ gram TL
# sürüklenmesi. Yani SATMAK ortalamada gram KAYBETTİRİR.
# Bunu tersine çeviren bir sinyal HENÜZ ÖLÇÜLMEDİ → taktik kol doğuştan kapalı.
karar:
  enabled: true
  model_version: "v1.0"        # DEĞİŞİRSE canlı karne SIFIRLANIR (dürüstlük şartı:
                               # farklı modelin tahminleri aynı karnede toplanamaz)
  enstruman: "banka_hesap"     # gidiş-dönüş maliyeti buradan (instrument_costs)
                               # ölçüldü: banka_hesap %1.20 · altins1 %0.40 (3× ucuz)
  ufuklar_gun: { "1hafta": 5, "1ay": 21, "3ay": 63 }
  birincil_ufuk: "1ay"         # HÜKÜM bloğunda öne çıkan
  # 6 ay YOK: 20 örtüşmeyen pencere kalıyor — hiçbir parametre dürüstçe
  # kalibre edilemez. Ölçüm raporda gösterilir, hükme girmez.

  cekirdek:                    # aylık düzenli alımı zamanlar; gidiş-dönüş makası ÖDEMEZ
    # Kapı değişkeni: reel net mevduat faizi (net mevduat − 12ay enflasyon beklentisi).
    # SEÇİLME SEBEBİ: taktik kazancın varyansının ~%91'i TL carry bacağında
    # (ons bacağı ~%31, kovaryans negatif) ve taranan 13 aday içinde tabanı yenen
    # tek şey buydu: >%10 iken fark +1.4p (N=29, t=1.4), <0 iken -1.9p (N=33).
    # t<2 → bu KANIT DEĞİL, en iyi adaydır. Bu yüzden kademeler DAR tutuldu:
    # 2x/0.5x gibi agresif bir kademe t=1.4'lük bir kanıtla savunulamaz.
    reel_mevduat_dusuk_pct: 0.0     # < 0  → altın lehine  → üst kademe
    reel_mevduat_yuksek_pct: 10.0   # > 10 → mevduat rekabetçi → alt kademe
    kademe_carpani_ust: 1.25
    kademe_carpani_alt: 0.75
    # <-- KADEME KAPISI (ADR #012, 2026-08-11). false iken hüküm daima AL 1.00×;
    # kural yine değerlendirilir ve "ne olurdu" gerekçede yazılır.
    #
    # KAPATMA GEREKÇESİ ÖLÇÜMDÜR, tercih değil:
    #   · `reel_mevduat > %10` ateşlendiğinde ertelemenin ortalama gram kazancı
    #     %-0.64 (N=22, t=1.03). Başa baş 0.00. Yani örneklem-İÇİ (en iyimser)
    #     ölçümde bile kural gram KAYBETTİRİYOR — taramada çekirdek sütunu ❌.
    #   · 0.75× kademenin beklenen aylık maliyeti 0.25 × (-0.64) ≈ -%0.16 gram.
    #   · Canlı örneklem-DIŞI: 2026-07-27 → 08-10 arası -%1.55 gram (gram +%9.55).
    #   · Kural 30/30 canlı tahminde ateşledi; kapı değişkeni %12.7-13.1 bandında
    #     çakılı (eşik %10) → maliyet sürekli, kazanç hiç ölçülmedi.
    #
    # AÇILMA ŞARTI (önceden kayıtlı, sonradan gevşetilmez): aday taramasında
    # kural çekirdek eşiğini (+1.99p) **N≥30 VE |t|≥2** ile geçmeli. O gün karne
    # metriği de alım-şiddeti uzayına taşınmalı — bugünkü `gram.hukum_dogru_mu`
    # SAT uzayında tanımlı ve `AL_*` için özdeş 0 üretir (L-010).
    kademe_aktif: false

  taktik:                      # SAT / geri al — pahalı kol, DOĞUŞTAN KAPALI
    aktif: false               # <-- KAPI. Aşağıdaki şart sağlanmadan AÇILMAZ.
    # Açılma şartı ÖNCEDEN KAYITLIDIR ve sonradan gevşetilmez. Bu, prim z-skoru
    # kapısının (stats.zscore_min_samples) ve signals.zscore_dry_run'ın aynısıdır:
    # kapı açılmadan önce kuru provayla dağılım öğrenilir.
    kapi_min_cozulmus: 30           # canlı karnede çözülmüş 1-ay tahmini
    kapi_min_gram_etkisi_pct: 0.0   # tahminlere uyulsaydı gram farkı > 0 olmalı
    kapi_min_isabet_farki_puan: 10.0
    maliyet_emniyet_carpani: 1.5    # beklenen kazanç bu çarpanla maliyeti aşmalı

  karne:
    zayif_n: 30                # < bu ise "ölçüm yetersiz". backtest.weak_n=15'ten
                               # SERT: burada seçilmiş bir kuralın karnesi ölçülüyor,
                               # ham bir dağılım değil.
    # chart.measure_edge'in faz artefaktının düzeltmesi. Ölçüldü (2026-07-26),
    # HAM ileri getiri tabanının yalnız faz seçiminden gelen yayılımı:
    #                h=21     h=63     h=126
    #   ons USD     0.91p    2.64p     7.46p
    #   gram TL     1.18p    3.23p    11.58p
    # chart.dogrulama.min_anlamli_fark_puan = 1.0 → h≥63'te faz gürültüsü eşiğin
    # 3-11 KATI. Yani tek-fazlı ölçümün uzun ufuk "zayıf kanıt" bulguları faz
    # artefaktından ayırt edilemez (bkz. reports/grafik_dogrulama.md).
    # NOT: gram-carry metriği bir ORAN metriği olduğu için çok daha kararlı —
    # aynı veride h=63 yayılımı yalnız 0.70p (reports/gram_engeli.md).

  # EVDS yayın gecikmesi — backfill'de look-ahead'i kapatır.
  # evds_daily.date DÖNEM BAŞIDIR, yayın tarihi değil: `date <= asof` filtresi
  # tek başına 1-35 gün geleceği sızdırır.
  evds_yayin_gecikme_gun:
    tufe: 35                   # ayın ~3'ünde önceki ay yayınlanır
    enf_bek_12ay: 25
    mevduat_3ay: 10            # haftalık seri, ~1 hafta gecikmeli
    mevduat_1yil: 10
    aofm_politika: 1

  # BACKFILL'DE KULLANILMAYAN kaynaklar ve NEDENLERİ (reddedilen özellik
  # gerekçesiyle kayda geçer — repo kuralı):
  #   gld_tonnage    : 19 satır (2026-07-07'den) — tarihçe yok
  #   prim_history   : ~250 kayıt / 19 gün — tarihçe yok
  #   FRED DFII10/DXY: üretimde 2026-07-07'den beri yanıt vermiyor → canlıda
  #                    hesaplanamayan bir özelliğin karnesi sahte olur
  #   Google Trends  : timeframe "today 5-y" değerleri pencere maksimumuna
  #                    normalize eder → bugün çekilen 2018 değeri GELECEĞİ İÇERİR
  #   gram TL OHLC   : üretilmiyor (db.py şema notu) → gram için yalnız kapanış

# ----------------- Kadran / gösterge uzlaşı paneli (rapor E.2) -----------------
# Her gösterge altın açısından olumlu(+1)/nötr(0)/olumsuz(-1) etiketlenir.
indicators:
  fred_base: "https://fred.stlouisfed.org/graph/fredgraph.csv"
  # FRED (fredgraph.csv) 2026-07-07'den beri ÜRETİMDE hiç yanıt vermedi; 2026-07-25'te
  # yerelden de ölçüldü: hem fredgraph.csv hem data/*.txt zaman aşımına düşüyor
  # (User-Agent'tan bağımsız → engelleme değil, endpoint ölü/aşırı yavaş).
  # Eski ayar (60 sn × 3 deneme × 2 seri) her rapor çalışmasında 6 dk'ya kadar
  # boşuna bekletiyordu. Çalıştığında FRED saniyeler içinde yanıt verir → hızlı pes et.
  fred_timeout_seconds: 15
  fred_retry: 1
  real_rate_series: "DFII10"            # ABD 10Y TIPS reel faiz
  dxy_series: "DTWEXBGS"                # geniş dolar endeksi (FRED)
  dxy_ticker: "DX-Y.NYB"               # yedek (yfinance)
  gld_ticker: "GLD"                     # tonaj = AUM/altın_fiyatı (eski CSV artık PDF)
  ons_ticker: "GC=F"
  trend_lookback_days: 21               # trend için ~1 ay
  thresholds:
    real_rate_bps: 5.0                  # |değişim| < 5bps -> nötr; düşüş -> olumlu
    dxy_pct: 0.5                        # |%değişim| < 0.5 -> nötr; düşüş -> olumlu
    gld_ton_pct: 0.5                    # tonaj |%| < 0.5 -> nötr; artış -> olumlu
    reel_faiz_dusuk: 2.0                # reel net mevduat < 2% -> altın olumlu
    reel_faiz_yuksek: 8.0               # > 8% -> altın olumsuz (mevduat rekabetçi)
    trends_z: 2.0                       # arama ilgisi z > 2 -> kalabalık yoğun (kontrarian olumsuz)

# ----------------- Grafik yorumu / teknik analiz (Bölüm 6) -----------------
# TÜM teknik hesap ons USD (GC=F) GERÇEK OHLC üzerinde yapılır.
# gram TL için OHLC TÜRETİLMEZ: high_ons × high_usd aynı ana ait değildir (senkron
# artefaktı → şişmiş ATR + hiç işlem görmemiş "fitil"ler). Ayrıca TL serisi enflasyonla
# yapısal olarak yukarı kayar; 2 yıl önceki "direnç" bugün anlamsızdır. TL yalnızca
# "ons seviyesinin bugünkü kurla izdüşümü" olarak, kullanılan kur yazılarak gösterilir.
chart:
  enabled: true
  ohlc:
    start: "2016-01-01"                 # history_daily ile aynı başlangıç
    symbols:                            # gerçek OHLC canlı doğrulandı (21 Tem 2026)
      ons: "GC=F"                       # ~2650 günlük bar
      kur: "TRY=X"                      # ~2745 günlük bar (hacim 0)
    guncelleme_lookback_gun: 10         # artımlı çekimde yeniden yazılan son N gün
    # daily.yml 15:35 UTC'de koşuyor, CME altın ~21:00 UTC'de kapanıyor → o günün barı
    # YARIM. Yarım bar üzerinde pivot/ATR hesaplamak gürültüyü sinyal diye sunmak olur.
    son_bar_kapanmamis_atla: true
  analiz:
    pencere_gun: 504                    # ~2 işlem yılı (birincil pencere)
    ikincil_pencere_gun: 252            # ~1 yıl — pencere kararlılığı çapraz kontrolü
  pivot:
    lookback_bar: 10                    # fraktal yarı-pencere (k) → 21 barlık pencere
    # Kalibrasyon (21 Tem 2026 ölçümü): 2 yıllık ons aralığı %138 genişlikte (2.352→5.586)
    # ve yalnız 30 pivot var. Güçlü trendde yatay seviyeler doğal olarak az tekrar eder:
    # tolerans %1'de en büyük küme 2 dokunuş. min_dokunus=3 => HİÇ seviye çıkmıyordu.
    # 2 dokunuş bir seviyenin tanım gereği asgarisidir (bir doğru için iki nokta);
    # zayıflığı gizlenmiyor — dokunuş sayısı ve skor (sqrt) raporda görünür.
    min_dokunus: 2
    kume_atr_carpani: 1.0               # tolerans = max(ATR% × bu, min_tolerans_pct) ≈ 1 ATR
    min_tolerans_pct: 0.4               # düşük oynaklıkta tolerans tabanı (%)
    yaricil_omur_gun: 180               # tazelik ağırlığı: 0.5 ** (yaş / bu)
    karma_seviye_carpani: 1.25          # hem destek hem direnç olmuş seviyeye skor primi
    gosterilecek_seviye: 3              # üstte/altta kaç seviye yazılsın
  gostergeler:
    rsi_window: 14
    atr_window: 14
    bollinger_window: 20
    bollinger_k: 2.0
    yapisal_swing_sayisi: 2             # HH/HL için karşılaştırılan son swing adedi
    thresholds:
      rsi_asiri_alim: 70.0
      rsi_asiri_satim: 30.0
      bollinger_ust_pctb: 1.0
      bollinger_alt_pctb: 0.0
      seviye_yakin_atr: 1.0             # |mesafe| < 1×ATR -> "seviyeye yakın"
      zirve_yakin_atr: 1.0              # zirveye bu kadar yakınsa "üstte direnç YOK" uyarısı
      atr_rejim_p_dusuk: 33.0           # ATR% persentili < bu -> düşük oynaklık
      atr_rejim_p_yuksek: 66.0
  # Görsel grafik (Bölüm 8f) — metnin EKİ, yerine geçmez.
  gorsel:
    gunluk_gonder: true        # daily_job raporun ardından PNG de gönderir
    cikti: "data/grafik.png"
    # matplotlib yalnız requirements.txt'te (daily.yml kurar). archive.yml
    # kurmuyor ve kurmasına gerek yok: grafik_ciz.ciz() matplotlib yoksa
    # None döner ve akış sessizce devam eder.

  dogrulama:
    yeniden_hesap_bar: 21               # walk-forward'da seviyeler kaç barda bir kurulur
    min_anlamli_fark_puan: 1.0          # |taban farkı| < bu puan -> "kenar yok"
    edge_cache_file: "data/grafik_edge.json"
    rapor_dosyasi: "grafik_dogrulama.md"
  # Grafik göstergeleri fiyat türevi ve birbiriyle korelasyonlu; ana panele 4 ayrı oy
  # olarak girerlerse panel makro kılığında bir momentum göstergesine dönüşür (ons_gma
  # zaten orada). Bu yüzden AYRI bir "grafik uzlaşısı" hesaplanır; ana panele tek oy girer.
  panele_katil: true

# ----------------- Google Trends kalabalık göstergesi (Bölüm 3) -----------------
trends:
  keywords: ["gram altın", "altın fiyatları"]
  geo: "TR"
  timeframe: "today 5-y"                # 5 yıl haftalık
  cache_hours: 24                       # günlük önbellek (rate-limit'e karşı)
  cache_file: "data/trends_cache.json"

# ----------------- Rapor / Telegram -----------------
# NOT: raporun saati BURADA DEĞİL, .github/workflows/daily.yml cron'unda
# tanımlıdır (15:35 UTC = 18:35 TR). Burada bir `report.hour_local: 20`
# anahtarı vardı: hiçbir kod onu okumuyordu ve değeri de yanlıştı.

# ----------------- Bildirim eşikleri (rehber 6.2; zamanlayıcı Actions'ta) -----------------
alerts:
  prim_abs_pct: 1.5                     # |prim| > bu -> bildirim
  prim_z: 2.0                           # |z| > bu
  daily_move_atr: 2.0                   # günlük hareket > N × ATR
  spread_percentile: 90                 # makas > tarihsel pN -> bildirim
  # Yüzdelik TEK BAŞINA eşik olamaz: pN tanımı gereği kayıtların %(100-N)'ini
  # aşar, yani alarm piyasadan bağımsız olarak ~her gün ateşler. Ölçüldü
  # 2026-08-11 (N=313 FRESH): medyan %0.0146 · p90 %0.0158 (medyanın 1.08 katı)
  # · gözlenen en yüksek %0.0260 (1.78 katı). Teslim edilen 19 bildirimin 12'si
  # bu kuraldandı ve hiçbiri sinyal değildi; üstelik günlük tavanı (6) yiyordu.
  # Bu yüzden yüzdeliğin yanına MADDİ taban eklendi: makas medyanın bu katını da
  # aşmalı. 2.0x'te 313 kaydın hiçbiri ateşlemezdi — doğrusu da bu, çünkü bu
  # dönemde makas patlaması OLMADI. Gerçek stresde alarm yine çalışır. (ADR #012)
  spread_min_medyan_carpani: 2.0
  quarter_z: 2.0                        # çeyrek primi |z| > bu
  cooldown_hours: 24                    # aynı sinyale soğuma
  daily_cap: 6                          # günlük toplam bildirim tavanı
  state_file: "data/alert_state.json"
  archive_freq_minutes: 15              # NOMİNAL cron (*/15) — archive.yml ile eşleşir
  # GitHub, düşük aktiviteli repolarda zamanlanmış iş akışlarını kısıtlar: cron */15 (günde 96)
  # yazsa da gerçekte teslim edilen çok daha seyrek. 12-21 Temmuz 2026 ölçümü: günde 10-17
  # çalışma (medyan ~15) => ~90-100 dk. Sağlık metrikleri NOMİNAL değil bu GÖZLEMLENEN ritme
  # göre hesaplanır; aksi halde sağlıklı sistem her gün "13 ardışık çalışma başarısız" der.
  archive_observed_freq_minutes: 90     # gözlemlenen gerçek ritim (~16 çalışma/gün)
  archive_gap_tolerance_factor: 3.0     # 90×3=270 dk; bunun altındaki boşluk normal kısıtlama
telegram:
  enabled: true
  # token + chat_id .env'den (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID)
  poll_timeout: 30
  # Komut yetkilendirmesi: TELEGRAM_CHAT_ID her zaman izinli.
  # Ek izinli sohbetler (opsiyonel); izinli değilse komut sessizce yoksayılır.
  extra_allowed_chat_ids: []
  # Giden mesaj arşivi: gönderilen her mesajı (rapor/alarm) JSONL'a yazar →
  # Telegram export'una gerek kalmadan repoda birikir. chat_id son 3 haneye kısılır.
  # NOT: public repo — içerik rapor/alarm (hassas değil); istemezsen gitignore'la.
  outbox_enabled: true
  outbox_file: "data/telegram_outbox.jsonl"

# ----------------- Supervisor (7/24 watchdog) -----------------
supervisor:
  singleton_port: 47615      # tek-instance kilidi (localhost bind)

